<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PONG · Lab 1 OOP</title>
  <style>
    :root { color-scheme: dark; --mint: #a7f3d0; --ink: #050912; --panel: #0b1220; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px;
      background: radial-gradient(circle at 50% 15%, #173047 0, #080d18 42%, #03050a 100%);
      color: #f8fafc; font-family: Inter, system-ui, sans-serif;
    }
    main { width: min(900px, 100%); text-align: center; }
    .titulo { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 14px; }
    h1 { margin: 0; font: 800 clamp(2rem, 7vw, 4rem)/1 monospace; letter-spacing: .28em; text-shadow: 0 0 24px #6ee7b755; }
    .etiqueta { color: var(--mint); font: 700 .75rem/1 monospace; letter-spacing: .14em; text-transform: uppercase; }
    #canvas-container { position: relative; overflow: hidden; border: 1px solid #94a3b8; border-radius: 12px; box-shadow: 0 22px 70px #000b, 0 0 32px #34d39922; }
    #estado-carregamento { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mint); font: 700 .85rem monospace; letter-spacing: .08em; }
    #estado-carregamento.pronto { display: none; }
    #estado-carregamento.erro { color: #fca5a5; padding: 30px; }
    canvas { display: block; width: 100% !important; height: auto !important; }
    .controlos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
    .cartao { background: #0b1220cc; border: 1px solid #334155; border-radius: 9px; padding: 11px; color: #cbd5e1; font-size: .82rem; }
    .cartao strong { display: block; margin-bottom: 5px; color: var(--mint); font: 700 .72rem monospace; letter-spacing: .08em; }
    footer { margin-top: 14px; color: #64748b; font: .72rem monospace; }
    @media (max-width: 620px) { .titulo { align-items: center; flex-direction: column; } .controlos { grid-template-columns: 1fr; } }
  </style>
  <script>
    window.addEventListener('error', function (evento) {
      const estado = document.getElementById('estado-carregamento');
      if (estado) { estado.className = 'erro'; estado.textContent = 'Erro ao iniciar: ' + evento.message; }
    });
  </script>
  <script src="lib/p5.min.js"></script>
</head>
<body>
  <main>
    <div class="titulo"><h1>PONG</h1><span class="etiqueta">Lab 1 · JavaScript OOP</span></div>
    <div id="canvas-container" aria-label="Jogo Pong"><div id="estado-carregamento">A CARREGAR…</div></div>
    <section class="controlos" aria-label="Controlos">
      <div class="cartao"><strong>JOGADOR 1</strong>W · S</div>
      <div class="cartao"><strong>JOGO</strong>ESPAÇO/ENTER iniciar · P pausa · M som</div>
      <div class="cartao"><strong>JOGADOR 2</strong>↑ · ↓ · I alterna computador</div>
    </section>
    <footer>Primeiro a 7 vence · funciona offline</footer>
  </main>

  <script src="src/campo.js"></script>
  <script src="src/raquete.js"></script>
  <script src="src/bola.js"></script>
  <script src="src/pontuacao.js"></script>
  <script src="src/som.js"></script>
  <script src="src/jogo.js"></script>
  <script>
    'use strict';
    let jogo;

    function setup() {
      const canvas = createCanvas(800, 500);
      canvas.parent('canvas-container');
      frameRate(60);
      jogo = new Jogo(window);
      jogo.inicializar();
      jogo.desenhar();
      document.getElementById('estado-carregamento').className = 'pronto';
    }

    function draw() {
      jogo.atualizarTeclas();
      jogo.atualizar();
      jogo.desenhar();
    }

    function keyPressed() {
      jogo.processarTecla(key, true);
      return ![' ', 'Enter', 'ArrowUp', 'ArrowDown'].includes(key);
    }

    function keyReleased() {
      jogo.processarTecla(key, false);
      return ![' ', 'Enter', 'ArrowUp', 'ArrowDown'].includes(key);
    }
  </script>
</body>
</html>
